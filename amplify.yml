version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
    build:
      commands:
        - 'echo "{\"DATABASE_URL\":\"$DATABASE_URL\",\"SESSION_SECRET\":\"$SESSION_SECRET\",\"WHATSAPP_API_URL\":\"$WHATSAPP_API_URL\",\"WHATSAPP_API_TOKEN\":\"$WHATSAPP_API_TOKEN\",\"WHATSAPP_INSTANCE\":\"$WHATSAPP_INSTANCE\",\"NEXT_PUBLIC_APP_URL\":\"$NEXT_PUBLIC_APP_URL\",\"GOVBR_CLIENT_ID\":\"$GOVBR_CLIENT_ID\",\"GOVBR_CLIENT_SECRET\":\"$GOVBR_CLIENT_SECRET\",\"GOVBR_REDIRECT_URI\":\"$GOVBR_REDIRECT_URI\",\"GOVBR_AUTH_URL\":\"$GOVBR_AUTH_URL\",\"GOVBR_TOKEN_URL\":\"$GOVBR_TOKEN_URL\",\"GOVBR_USERINFO_URL\":\"$GOVBR_USERINFO_URL\"}" > env-config.json'
        - npm run build
        - cp env-config.json .next/env-config.json
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
