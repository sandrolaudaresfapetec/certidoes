app = 'certidoes-app'
primary_region = 'iad'

[build]

# Migration roda em VM de release descartavel ANTES do deploy entrar no ar.
# Se falhar, o deploy aborta e a versao atual continua no ar (sem SSH, sem downtime).
[deploy]
  release_command = "npx prisma migrate deploy --config prisma.config.postgres.ts"

# `app` serve o Next.js; `sigef_sync` sincroniza o acervo SIGEF todo dia as 02:00
# (America/Sao_Paulo). Precisa rodar em `gru`: o INCRA so responde a IPs do Brasil
# (scripts/deploy-fly.sh posiciona a maquina).
[processes]
  app = "npm run start"
  sigef_sync = "npx tsx scripts/sigef-scheduler.ts"

[http_service]
  internal_port = 3000
  processes = ['app']
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['sigef_sync']
